server:
  port: ${PORT:8082}
  address: 0.0.0.0

spring:
  application:
    name: servicio-vuelos-capebe

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:capebeBD}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

services:
  sync:
    enabled: ${SYNC_SERVICES:true}
  pista:
    url: ${PISTA_SERVICE_URL:http://localhost:8083}
  qr:
    url: ${QR_SERVICE_URL:http://localhost:8084}
