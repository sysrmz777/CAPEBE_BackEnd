services:
  postgres-db:
    image: postgres:18-alpine
    container_name: postgres_capebe
    restart: always
    environment:
      POSTGRES_DB: capebeBD
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d capebeBD"]
      interval: 5s
      timeout: 5s
      retries: 10

  pista-api:
    build: .
    container_name: capebe_pista_api
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: capebeBD
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DDL_AUTO: update
      SHOW_SQL: "true"

volumes:
  postgres_data:
